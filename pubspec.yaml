name: mamagochi
description: Mamagochi

version: 1.0.42+42

environment:
  sdk: ">=3.1.0 <4.0.0"

publish_to: none

dependencies:
  collection: any
  cupertino_icons: any
  device_info_plus: any
  flutter:
    sdk: flutter
  flutter_dotenv: any
  flutter_localizations:
    sdk: flutter
  flutter_mobx: any
  flutter_slidable: any
  get_it: any
  go_router: any
  hive: any
  intl: any
  jiffy: any
  mobx: any
  package_info_plus: any
  path_provider: any
  url_launcher: any

dev_dependencies:
  build_runner: any
  flutter_launcher_icons: any
  flutter_lints: any
  flutter_native_splash: any
  hive_generator: any
  intl_utils: any
  mobx_codegen: any

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/ca/
    - assets/fonts/
    - assets/images/
  fonts:
    - family: MontserratMamagochi
      fonts:
        - asset: assets/fonts/Montserrat-R.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-M.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-B.ttf
          weight: 700

# dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  web:
    generate: true
  image_path: scripts/ios_icon_raw.png

flutter_intl:
  main_locale: en
  enabled: true
  arb_dir: lib/L3_app/l10n # Optional. Default: lib/l10n
  output_dir: lib/L3_app/l10n/generated # Optional. Default: lib/generated

# https://pub.dev/packages/flutter_native_splash:
# dart run flutter_native_splash:create
# Исходная картинка должна быть @4x
# после запуска команды вручную заменить все измененные изображения, т.к. очень плохо ресайзит, размер больших больше, а мелкие - лесенкой все
flutter_native_splash:
  color: "#EFF2FB"
  color_dark: "#2B3049"
  android_12:
    color: "#EFF2FB"
    color_dark: "#2B3049"
    image: scripts/launch_image_android12.png
    image_dark: scripts/launch_image_android12_dark.png

  image: scripts/launch_image.png
  image_dark: scripts/launch_image_dark.png